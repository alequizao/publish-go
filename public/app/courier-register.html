<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>window.PG_BASE='/publishgo';</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Seja um entregador — Publish Go</title>
    <link rel="icon" href="/publishgo/favicon.ico" />
    <meta name="theme-color" content="#F5A623" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } };</script>
    <link rel="stylesheet" href="/publishgo/assets/css/app.css?v=202606041800" />
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen py-6 px-4">
<div class="pg-aurora"></div>
<div class="w-full max-w-xl mx-auto pg-card p-6 sm:p-8 pg-pop" x-data="reg()" x-init="init()">
    <div class="text-center mb-6">
        <div class="w-14 h-14 rounded-2xl grid place-items-center text-white text-2xl mx-auto mb-3" style="background:linear-gradient(135deg,var(--pg-primary),var(--pg-accent))">🛵</div>
        <h1 class="text-2xl font-extrabold">Cadastro de entregador</h1>
        <p class="text-sm mt-1" style="color:var(--pg-muted)">Preencha seus dados para começar a fazer entregas</p>
    </div>

    <form @submit.prevent="submit()" class="space-y-6">

        <!-- Empresa -->
        <div>
            <label class="text-sm font-medium">Estabelecimento</label>
            <template x-if="lockedCompany">
                <div class="pg-input mt-1 flex items-center gap-2 font-semibold"><span>🏪</span><span x-text="companyName"></span></div>
            </template>
            <template x-if="!lockedCompany">
                <select x-model="slug" required class="pg-input mt-1">
                    <option value="">Selecione a empresa…</option>
                    <template x-for="c in companies" :key="c.slug"><option :value="c.slug" x-text="c.name"></option></template>
                </select>
            </template>
        </div>

        <!-- Dados pessoais -->
        <section>
            <h2 class="font-bold text-sm uppercase tracking-wide mb-3" style="color:var(--pg-muted)">Dados pessoais</h2>
            <div class="grid sm:grid-cols-2 gap-3">
                <div class="sm:col-span-2"><label class="text-sm font-medium">Nome completo *</label><input x-model="f.name" required class="pg-input mt-1" /></div>
                <div><label class="text-sm font-medium">CPF *</label><input x-model="f.cpf" required class="pg-input mt-1" inputmode="numeric" placeholder="000.000.000-00" @input="f.cpf=maskCpf(f.cpf)" /></div>
                <div><label class="text-sm font-medium">Nascimento</label><input x-model="f.birth_date" type="date" class="pg-input mt-1" /></div>
                <div><label class="text-sm font-medium">Telefone (WhatsApp) *</label><input x-model="f.phone" required class="pg-input mt-1" placeholder="(82) 90000-0000" /></div>
                <div><label class="text-sm font-medium">E-mail</label><input x-model="f.email" type="email" class="pg-input mt-1" /></div>
                <div class="sm:col-span-2"><label class="text-sm font-medium">Endereço</label><input x-model="f.address" class="pg-input mt-1" placeholder="Rua, número - bairro, cidade" /></div>
            </div>
        </section>

        <!-- CNH -->
        <section>
            <h2 class="font-bold text-sm uppercase tracking-wide mb-3" style="color:var(--pg-muted)">Habilitação (CNH)</h2>
            <div class="grid sm:grid-cols-2 gap-3">
                <div><label class="text-sm font-medium">Número da CNH</label><input x-model="f.cnh_number" class="pg-input mt-1" inputmode="numeric" placeholder="00000000000" /></div>
                <div>
                    <label class="text-sm font-medium">Categoria</label>
                    <select x-model="f.cnh_category" class="pg-input mt-1">
                        <option value="">—</option>
                        <option value="A">A</option><option value="B">B</option><option value="AB">AB</option>
                        <option value="AC">AC</option><option value="AD">AD</option><option value="AE">AE</option>
                    </select>
                </div>
                <div><label class="text-sm font-medium">Validade</label><input x-model="f.cnh_expiry" type="date" class="pg-input mt-1" /></div>
                <div>
                    <label class="text-sm font-medium">Atividade remunerada (EAR)?</label>
                    <div class="flex gap-2 mt-1">
                        <button type="button" @click="f.cnh_ear='1'" :class="f.cnh_ear==='1'?'pg-btn-primary':'pg-btn-ghost'" class="pg-btn flex-1 !py-2 text-sm">Sim</button>
                        <button type="button" @click="f.cnh_ear='0'" :class="f.cnh_ear==='0'?'pg-btn-primary':'pg-btn-ghost'" class="pg-btn flex-1 !py-2 text-sm">Não</button>
                    </div>
                </div>
            </div>
            <!-- Upload CNH -->
            <div class="mt-3">
                <label class="text-sm font-medium">CNH digital (foto ou PDF)</label>
                <div x-html="docWidget('cnh')"></div>
                <input id="file-cnh" type="file" accept="image/*,application/pdf" class="hidden" @change="uploadDoc($event,'cnh')" />
                <input id="cam-cnh" type="file" accept="image/*" capture="environment" class="hidden" @change="uploadDoc($event,'cnh')" />
            </div>
        </section>

        <!-- Veículo -->
        <section>
            <h2 class="font-bold text-sm uppercase tracking-wide mb-3" style="color:var(--pg-muted)">Veículo</h2>
            <div class="grid sm:grid-cols-2 gap-3">
                <div>
                    <label class="text-sm font-medium">Tipo</label>
                    <select x-model="f.vehicle" class="pg-input mt-1"><option value="moto">Moto</option><option value="bike">Bike</option><option value="car">Carro</option></select>
                </div>
                <div><label class="text-sm font-medium">Placa</label><input x-model="f.plate" class="pg-input mt-1 uppercase" placeholder="ABC-1D23" /></div>
                <div><label class="text-sm font-medium">Marca</label><input x-model="f.vehicle_brand" class="pg-input mt-1" placeholder="Honda" /></div>
                <div><label class="text-sm font-medium">Modelo</label><input x-model="f.vehicle_model" class="pg-input mt-1" placeholder="CG 160" /></div>
                <div><label class="text-sm font-medium">Ano</label><input x-model="f.vehicle_year" type="number" class="pg-input mt-1" placeholder="2022" /></div>
                <div><label class="text-sm font-medium">Cor</label><input x-model="f.vehicle_color" class="pg-input mt-1" placeholder="Vermelha" /></div>
                <div class="sm:col-span-2"><label class="text-sm font-medium">RENAVAM</label><input x-model="f.vehicle_renavam" class="pg-input mt-1" inputmode="numeric" placeholder="00000000000" /></div>
            </div>
            <!-- Upload documento do veículo -->
            <div class="mt-3">
                <label class="text-sm font-medium">Documento do veículo / CRLV (foto ou PDF)</label>
                <div x-html="docWidget('veh')"></div>
                <input id="file-veh" type="file" accept="image/*,application/pdf" class="hidden" @change="uploadDoc($event,'veh')" />
                <input id="cam-veh" type="file" accept="image/*" capture="environment" class="hidden" @change="uploadDoc($event,'veh')" />
            </div>
        </section>

        <!-- Acesso -->
        <section>
            <h2 class="font-bold text-sm uppercase tracking-wide mb-3" style="color:var(--pg-muted)">Senha de acesso</h2>
            <input x-model="f.password" type="password" required minlength="6" class="pg-input" placeholder="Crie uma senha (mín. 6)" />
        </section>

        <button type="submit" :disabled="saving || !slug || uploading" class="pg-btn pg-btn-primary w-full !py-3">
            <span x-show="!saving && !uploading">Criar minha conta</span>
            <span x-show="uploading && !saving">Enviando documento…</span>
            <svg x-show="saving" class="pg-ring-spin w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 3a9 9 0 109 9"/></svg>
        </button>
        <p x-show="!loadingCos && companies.length===0 && !lockedCompany" class="text-xs text-center text-amber-500">Nenhuma empresa disponível para cadastro no momento.</p>
        <a :href="PG.url('/app/courier.html')" class="block text-center text-sm" style="color:var(--pg-muted)">Já tenho conta — entrar →</a>
    </form>
</div>

<script src="/publishgo/assets/js/app.js?v=202606041800"></script>
<script>
function reg() {
    return {
        saving:false, uploading:false, slug:'', companyName:'', lockedCompany:false, companies:[], loadingCos:true,
        docs:{ cnh:{name:'',url:'',isPdf:false}, veh:{name:'',url:'',isPdf:false} },
        f:{ name:'',cpf:'',birth_date:'',phone:'',email:'',address:'',password:'',
            cnh_number:'',cnh_category:'',cnh_ear:'0',cnh_expiry:'',cnh_file_url:'',
            vehicle:'moto',plate:'',vehicle_brand:'',vehicle_model:'',vehicle_year:'',vehicle_color:'',vehicle_renavam:'',vehicle_doc_url:'' },
        async init(){
            this.slug = new URLSearchParams(location.search).get('empresa') || '';
            try { this.companies = await PG.api.get('/public/companies'); } catch(e){ this.companies=[]; }
            this.loadingCos = false;
            if (this.slug) {
                const found = this.companies.find(c=>c.slug===this.slug);
                if (found) { this.lockedCompany = true; this.companyName = found.name; if(found.primary_color) document.documentElement.style.setProperty('--pg-primary', found.primary_color); }
                else { this.slug = ''; }
            }
        },
        maskCpf(v){ v=(v||'').replace(/\D/g,'').slice(0,11); return v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'); },
        docWidget(key){
            const d=this.docs[key];
            if(d.url){
                const thumb = d.isPdf ? '<div class="w-12 h-12 rounded-lg grid place-items-center text-2xl" style="background:color-mix(in srgb,var(--pg-text) 8%,transparent)">📄</div>'
                                      : '<img src="'+d.url+'" class="w-12 h-12 rounded-lg object-cover" />';
                return '<div class="mt-1 flex items-center gap-3 p-2 rounded-xl" style="background:color-mix(in srgb,var(--pg-text) 5%,transparent)">'
                    + thumb + '<div class="flex-1 min-w-0"><div class="text-sm font-medium truncate">'+d.name+'</div><div class="text-xs" style="color:#22c55e">✓ enviado</div></div>'
                    + '<button type="button" onclick="document.getElementById(\'file-'+key+'\').click()" class="pg-btn pg-btn-ghost !p-2 text-xs">trocar</button></div>';
            }
            return '<div class="mt-1 grid grid-cols-2 gap-2">'
                + '<button type="button" onclick="document.getElementById(\'cam-'+key+'\').click()" class="pg-btn pg-btn-ghost text-sm">📷 Tirar foto</button>'
                + '<button type="button" onclick="document.getElementById(\'file-'+key+'\').click()" class="pg-btn pg-btn-ghost text-sm">📎 Arquivo / PDF</button></div>';
        },
        async uploadDoc(e, key){
            const file=e.target.files[0]; if(!file) return;
            this.uploading=true;
            try{
                const fd=new FormData(); fd.append('file', file);
                const res=await fetch(PG.url('/api/public/upload'),{ method:'POST', body:fd });
                const json=await res.json();
                if(!json.ok) throw json.error;
                const isPdf=/pdf$/i.test(file.name) || file.type==='application/pdf';
                this.docs[key]={ name:file.name, url:json.data.url, isPdf };
                if(key==='cnh') this.f.cnh_file_url=json.data.url; else this.f.vehicle_doc_url=json.data.url;
                PG.toast('Documento enviado!','success');
            }catch(err){ PG.toast(err.message||'Falha no envio.','error'); }
            finally{ this.uploading=false; e.target.value=''; }
        },
        async submit(){
            this.saving=true;
            try{
                const payload={ ...this.f, company_slug:this.slug };
                if(payload.vehicle_year==='') delete payload.vehicle_year; else payload.vehicle_year=Number(payload.vehicle_year);
                const data = await PG.api.post('/courier/register', payload);
                localStorage.setItem('pg_courier_auth', JSON.stringify(data));
                PG.toast('Conta criada! Bem-vindo 🛵','success');
                setTimeout(()=>location.href=PG.url('/app/courier.html'),600);
            }catch(e){ const d=e.details?Object.values(e.details).flat()[0]:null; PG.toast(d||e.message,'error'); }
            finally{ this.saving=false; }
        },
    };
}
</script>
</body>
</html>
